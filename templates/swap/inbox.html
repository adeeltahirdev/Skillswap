{% extends 'base.html' %}{% block title %}Messages - Skill Swap{% endblock %}{% block content %}<section class="py-5"><div class="container"><span class="section-tag">Conversations</span><h1 class="text-white mt-2 mb-4">Messages</h1><div class="glass p-3">{% for other_user in users %}<a href="{% url 'conversation' username=other_user.username %}" class="notification-item"><i class="bi bi-person-circle"></i><div><strong>{{ other_user.username }}</strong><p>Open conversation</p></div></a>{% empty %}<p class="text-muted text-center py-4">No messages yet. Start one from a member's profile.</p>{% endfor %}</div></div></section>{% endblock %}
